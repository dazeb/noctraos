name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax + shellcheck (warning severity)
        run: |
          fail=0
          for f in boot.sh install.sh install/*.sh install/optional/*.sh install/desktop/*/*.sh bin/noc bin/noc-gpu bin/noc-privileged bin/noctraos-hermes bin/noctraos-control bin/noctraos-agent bin/noctraos-copyq configs/nautilus-scripts/* iso/flavours/*.sh iso/firstboot-runner.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || fail=1
            # firstboot-runner.sh is pinned to the Zorin heredoc text, so its inherited SC2164 stays
            case "$f" in iso/firstboot-runner.sh) x=SC2164 ;; *) x=SC0000 ;; esac
            shellcheck --severity=warning --exclude="$x" "$f" || fail=1
          done
          exit $fail

      - name: Version consistency
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          fail=0
          for f in bin/noc bin/noc-gpu; do
            grep -q "^VERSION=\"$v\"" "$f" || { echo "$f does not match VERSION ($v)"; fail=1; }
          done
          exit $fail
