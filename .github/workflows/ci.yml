name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax + shellcheck (warning severity)
        run: |
          fail=0
          for f in boot.sh install.sh install/*.sh install/optional/*.sh bin/noc bin/noc-gpu bin/noc-privileged bin/noctraos-hermes bin/noctraos-control bin/noctraos-agent bin/noctraos-copyq configs/nautilus-scripts/*; do
            [ -f "$f" ] || continue
            bash -n "$f" || fail=1
            shellcheck --severity=warning "$f" || fail=1
          done
          exit $fail

      - name: Version consistency
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          fail=0
          for f in bin/noc bin/noc-gpu; do
            grep -q "^VERSION=\"$v\"" "$f" || { echo "$f does not match VERSION ($v)"; fail=1; }
          done
          exit $fail
