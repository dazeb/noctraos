# GitLab CI for noctraos, run by the homelab GitLab (http://192.168.8.111:8929) on its
# Docker runner. GitHub Actions is not available on this account, so this is the CI.
# It replaces .github/workflows/ci.yml; keep the two checks in step if both are ever used.
#
#   check   shell syntax + shellcheck, the VERSION / bin/noc / bin/noc-gpu match, the unit
#           tests, and the theme outputs matching configs/theme/palette.json.
#
# Pushing a tag vX.Y.Z (that is, `git push gitlab vX.Y.Z`) runs the release, on the release runner:
#
#   release-build    ISO + appliance ISO, an unattended install in a KVM VM, first-boot provisioning,
#                    `noc doctor`, sysprep, qcow2/vmdk export, torrent, SHA256SUMS, a boot test of the
#                    exported disk. 45 to 90 minutes. Nothing is public yet.
#   release-publish  upload to dl.noctraos.dev/releases/vX.Y.Z/, verify every file through the public
#                    hostname, create the GitHub release. Refuses a version that is already published.
#   release-site     PR to GitHub main with the new download page, torrent, checksums and cards;
#                    merging it is the deploy, because Cloudflare builds the site from GitHub main
#                    (wrangler.jsonc). The job waits until noctraos.dev shows the version.
#
# The release jobs need a runner with the tag `noctraos-release` (iso/setup-release-runner.sh makes
# one on the workstation: Docker, KVM and the secrets live there). It only takes protected refs and
# only this project's jobs, and `v*` tags are protected, so a branch pipeline cannot reach it.
# Everything else (the checks below) runs on the normal Docker runner. docs/release-runbook.md.
#
# Updates for machines that are already installed (docs/updates.md) have their own jobs, on the same runner, because the signing
# key lives on the workstation. Two ways in:
#
#   a tag update-YYYY.MM.DD[-N]   an update without an ISO. The tag message is the "what's new" line the Updates page shows;
#                                 lines `Relogin: yes` / `Reboot: yes` in it say the person must sign out or restart afterwards.
#   a release tag vX.Y.Z          after release-site, the same version also goes out as an update.
#
#   update-nightly   publish the tagged commit as the next update on the nightly channel (testers); the commit must be in GitHub main
#   update-stable-10 / -50 / -100   MANUAL: promote that update to the stable channel at 10 percent of machines, then widen it. Do these
#                                   one at a time over a few days while nightly testers report; a job refuses anything but this
#                                   pipeline's update and never lowers a rollout (iso/ci-publish-update.sh).
#
# Push to GitLab with `git push gitlab <branch>`.

stages:
  - check
  - release-build
  - release-publish
  - release-site
  - update

variables:
  TZ: UTC
  DEBIAN_FRONTEND: noninteractive

# Run branch pipelines, and merge request pipelines, but not both for the same push.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_TAG =~ /^update-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$/
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

shell:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq shellcheck >/dev/null
  script:
    - |
      fail=0
      for f in boot.sh install.sh install/*.sh install/optional/*.sh bin/noc bin/noc-gpu bin/noc-privileged bin/noctraos-hermes bin/noctraos-control \
               bin/noctraos-agent bin/noctraos-copyq bin/noctraos-search configs/nautilus-scripts/* iso/*.sh scripts/*.sh; do
        [ -f "$f" ] || continue
        bash -n "$f" || fail=1
        shellcheck --severity=warning "$f" || fail=1
      done
      exit $fail

version:
  stage: check
  image: ubuntu:24.04
  script:
    - |
      v=$(tr -d '[:space:]' < VERSION)
      fail=0
      for f in bin/noc bin/noc-gpu; do
        grep -q "^VERSION=\"$v\"" "$f" || { echo "$f does not match VERSION ($v)"; fail=1; }
      done
      exit $fail

tests:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3 jq curl git openssh-client >/dev/null   # jq: JSON modes of noc/noc-gpu; curl: noc talks to a fake Ollama in tests; git + ssh-keygen: the update bundle and signing tests
  script:
    - python3 -B -m unittest discover -s tests -v
    - python3 -B scripts/render-theme.py --check

# ---- release (tags vX.Y.Z only) ---------------------------------------------------------------

# Where the builds live on the release runner: an ext4 work image on the big drive, the base Zorin
# ISO in in/. Not in the checkout, so a re-run reuses the downloaded torf venv and the work image.
.release:
  tags: [noctraos-release]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  variables:
    RELEASE_BUILD_DIR: /run/media/dazeb/2tb/noctraos-release-ci
    GIT_DEPTH: "0"          # release notes list the commits since the previous tag
  # One release at a time: the VM, its ssh port and the work image are shared.
  resource_group: noctraos-release

release-build:
  extends: .release
  stage: release-build
  needs: [shell, version, tests]
  timeout: 3h
  script:
    - iso/build-release.sh "$RELEASE_BUILD_DIR"

release-publish:
  extends: .release
  stage: release-publish
  needs: [release-build]
  timeout: 3h             # three uploads and three downloads of 3 to 17 GB each
  script:
    - iso/publish-release.sh "$RELEASE_BUILD_DIR"

release-site:
  extends: .release
  stage: release-site
  needs: [release-publish]
  timeout: 45m
  script:
    - scripts/release-site-pr.sh "$RELEASE_BUILD_DIR"

# ---- updates for installed machines (update-* tags, and vX.Y.Z after the release) ----------------

.update:
  tags: [noctraos-release]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_TAG =~ /^update-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$/
  variables:
    GIT_DEPTH: "0"          # the commit is checked against GitHub main's history
  # One publish at a time (publish-update.sh also takes a lock): serials are handed out one by one.
  resource_group: noctraos-update

update-nightly:
  extends: .update
  stage: update
  # An update tag waits for the checks; a release tag also waits for the release to be out.
  needs:
    - {job: shell, optional: true}
    - {job: version, optional: true}
    - {job: tests, optional: true}
    - {job: release-site, optional: true}
  timeout: 30m
  script:
    - iso/ci-publish-update.sh nightly "$CI_COMMIT_TAG"

.update-stable:
  extends: .update
  stage: update
  needs: [update-nightly]
  when: manual
  allow_failure: true       # a manual job nobody has pressed yet must not hold the pipeline open
  timeout: 30m

update-stable-10:
  extends: .update-stable
  script:
    - iso/ci-publish-update.sh promote 10

update-stable-50:
  extends: .update-stable
  script:
    - iso/ci-publish-update.sh widen 50

update-stable-100:
  extends: .update-stable
  script:
    - iso/ci-publish-update.sh widen 100
